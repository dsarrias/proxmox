x-healthcheck-template: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    networks:
      - monitoring
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/data:/prometheus
    ports:
      - 9090:9090
    restart: unless-stopped
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]

  alertmanager:
    image: prom/alertmanager:v0.35.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - monitoring
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./telegram.tmpl:/etc/alertmanager/telegram.tmpl:ro
      - ./alertmanager/data:/alertmanager
    ports:
      - 9093:9093
    restart: unless-stopped
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    networks:
      - monitoring
    environment:
      - TZ={{ TIMEZONE }}
      - GF_SECURITY_ADMIN_PASSWORD={{ GRAFANA_ADMIN_PASS }}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/docker-containers.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/data:/var/lib/grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - ./textfile:/textfile:ro
    restart: unless-stopped
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/"]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --enable_metrics=cpu,memory,network,diskIO,oom_event
    networks:
      - monitoring
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]

networks:
  monitoring:
