- name: Include common variables
  include_vars:
    file: "{{ playbook_dir }}/roles/common/vars/main.yml"
    
- name: Update apt cache and upgrade all packages
  apt: 
    update_cache: yes
    upgrade: dist
  tags: installation, upgrade, packages

- name: Install common packages
  apt:
    name: "{{ item }}"
    state: latest
  loop:
    - vim
    - curl
    - zsh
    - git
    - bat
    - btop
    - apt-transport-https
    - ca-certificates
    - ntfs-3g
    - nfs-common
    - gnupg2
    - fail2ban
    - software-properties-common
    - python3-venv
  tags: installation, packages

# ctop
- name: Install docker-ctop
  get_url:
    url: https://github.com/bcicen/ctop/releases/download/v0.7.7/ctop-0.7.7-linux-amd64
    dest: /usr/local/bin/ctop
    mode: '0755'
  tags: installation, ctop

# Docker
- name: Install Docker
  become: true
  block:
    # Replaced by docker.sources below, apt fails on conflicting Signed-By
    - name: Remove legacy Docker apt list
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Add Docker's apt repository
      deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Install Docker and related packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: yes

    - name: Add my user to Docker
      user:
        name: "{{ USER }}"
        groups: docker
        append: yes

  tags: docker

# ZSH
- name: Install Oh My Zsh and setup
  block:
    - name: Install Oh My Zsh
      become_user: "{{ USER }}"
      git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: ~/.oh-my-zsh
        clone: yes

    - name: Create directory for Powerlevel10k
      file:
        path: $HOME/.oh-my-zsh/custom/themes/powerlevel10k
        state: directory
        owner: "{{ USER }}"
        group: "{{ USER }}"
        mode: '0755'

    - name: Download Powerlevel10k
      become_user: "{{ USER }}"
      git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "$HOME/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1

    - name: Generate zshrc file and copy it
      become_user: "{{ USER }}"
      template:
        src: zshrc
        dest: "~/.zshrc"

    - name: Set Zsh as default shell
      become: true
      shell: chsh -s "$(which zsh)" {{ USER }}

  tags: zsh