- name: Append a line to docker file to store temps in disk
  lineinfile:
    path: /etc/default/docker
    line: export DOCKER_TMPDIR="/tmp/docker"
    insertafter: EOF
  tags: docker

- name: Generate compose.yml file and copy it
  template:
    src: compose.yml
    dest: "{{ USER_PATH }}/compose.yml"
    owner: "{{ USER }}"
    group: "{{ USER }}"
    mode: '0600'
  tags: docker, compose, compose-restart, container

# Only runs when the compose-restart tag is requested explicitly
- name: Stop Docker
  command: docker compose down --remove-orphans
  args:
    chdir: "{{ USER_PATH }}"
  tags: never, compose-restart

# Only (re)creates containers whose config or image changed
- name: Start Docker
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ USER_PATH }}"
  environment:
    COMPOSE_HTTP_TIMEOUT: "200"
  register: compose_up
  changed_when: compose_up.stderr is search('Creat|Recreat|Start|Remov')
  tags: docker, compose-restart, compose-start

- name: Restart Docker Container
  command: docker compose up -d --force-recreate {{ container | quote }}
  args:
    chdir: "{{ USER_PATH }}"
  when: container is defined
  tags: container