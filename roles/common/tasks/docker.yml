- name: Append a line to docker file to store temps in disk
  lineinfile:
    path: /etc/default/docker
    line: export DOCKER_TMPDIR="/tmp/docker"
    insertafter: EOF
  tags: docker

- name: Create Time Machine users directory
  file:
    path: "{{ DOCKER_CONFIG }}/timemachine/users"
    state: directory
    mode: '0700'
  tags: docker, compose, container

- name: Generate Time Machine user configs
  template:
    src: timemachine_user.conf
    dest: "{{ DOCKER_CONFIG }}/timemachine/users/{{ item.USER | lower }}.conf"
    mode: '0600'
  loop: "{{ TIMEMACHINE_USERS }}"
  loop_control:
    index_var: idx
    label: "{{ item.USER | lower }}"
  tags: docker, compose, container

- name: Create Seerr config directory
  file:
    path: "{{ DOCKER_CONFIG }}/seerr"
    state: directory
    owner: "1000" # Seerr runs as node (UID 1000), not PUID
    group: "1000"
  tags: docker, compose, container

- name: Create JellyBridge library directory
  file:
    path: "{{ NEW_STORAGE }}/jellybridge"
    state: directory
    owner: "{{ PUID }}"
    group: "{{ PGID }}"
  tags: docker, compose, container

- name: Generate compose.yml file and copy it
  template:
    src: compose.yml
    dest: "{{ USER_PATH }}/compose.yml"
    owner: "{{ USER }}"
    group: "{{ USER }}"
    mode: '0600'
  tags: docker, compose, compose-restart, container

- name: Stop Docker
  command: docker compose down --remove-orphans
  args:
    chdir: "{{ USER_PATH }}"
  tags: never, compose-restart

- name: Start Docker
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ USER_PATH }}"
  environment:
    COMPOSE_HTTP_TIMEOUT: "200"
  register: compose_up
  changed_when: compose_up.stderr is search('Creat|Recreat|Start|Remov')
  tags: docker, compose-restart, compose-start

- name: Restart Docker Container
  command: docker compose up -d --force-recreate {{ container | quote }}
  args:
    chdir: "{{ USER_PATH }}"
  when: container is defined
  tags: container